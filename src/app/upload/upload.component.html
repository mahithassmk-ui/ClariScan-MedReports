<main class="page-content">
  <section class="hero-section">
    <div class="hero-copy">
      <span class="eyebrow">Welcome back</span>
      <h2>Clarity before <span>Consultation.</span></h2>
      <p>Don't stress over complex radiology and lab results. Upload your report now to get a simplified summary, clear insights, and personalized questions to bring to your next appointment.
    </div>
  </section>

  <section class="start-section">
    <div class="section-header">
      <div>
        <span class="section-eyebrow">Start here</span>
        <h3>Add a new report</h3>
      </div>
    </div>

    <div class="start-grid">
      <label class="upload-box">
        <input type="file" accept=".pdf,image/*" (change)="onFileSelected($event)" />
        <div class="upload-icon">↥</div>
        <div class="upload-text">
          <strong>Upload your report</strong>
          <span>PDF, PNG, or JPG · up to 20 MB</span>
        </div>
        <div class="upload-selected">{{ fileName || 'No file selected' }}</div>
      </label>

      <div class="type-box">
        <div class="question">What kind of report is this?</div>
        <div class="type-options">
          <button class="type-option active" type="button">Radiology / Scan</button>
          <button class="type-option" type="button">Lab results</button>
        </div>
        <button class="primary-btn" (click)="submitReport()" [disabled]="loading || !selectedFile">
          {{ loading ? 'Processing...' : 'Explain my report →' }}
        </button>
      </div>
    </div>
  </section>

</main>
